name: Build Bouh Al Qalam APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'store-launcher.svg'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Render exact store icon into Android resources
        run: |
          python3 -m pip install --user cairosvg
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          python3 -c "import cairosvg; cairosvg.svg2png(url='store-launcher.svg',write_to='android-app/app/src/main/res/drawable-nodpi/store_launcher.png',output_width=432,output_height=432)"
      - name: Build installable debug APK
        run: cd android-app && gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bouh-Al-Qalam-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK for direct website download
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/bouh-alqalam.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/bouh-alqalam.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest Bouh Al Qalam APK for direct download"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "APK published successfully"
                exit 0
              fi
              sleep 8
            done
            echo "Could not publish APK after retries"
            exit 1
          fi
